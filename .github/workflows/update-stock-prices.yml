name: 주식 시세 자동 갱신

on:
  schedule:
    # 한국 시장 마감 뒤 Yahoo Finance에 일봉이 반영될 시간을 둔다.
    - cron: '20 16 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 종가 조회 후 Supabase 갱신
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_CODE: ${{ secrets.SYNC_CODE }}
        run: node scripts/update-stock-prices.mjs
