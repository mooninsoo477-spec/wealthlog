<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7FB">
<title>자산 로드맵</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="자산로드맵">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface2:#EAF0F3;
  --ink:#16323F; --ink2:#4F6B78; --ink3:#8AA2AD;
  --line:#DDE6EA; --line2:#EEF3F5;
  --accent:#0E8F93; --accent-soft:#E2F2F1;
  --up:#1E8E5A; --down:#D2554A; --amber:#D99A2B;
  --radius:14px;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --serif:'Gowun Batang','Apple SD Gothic Neo',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:470px;margin:0 auto;padding:18px 16px 56px}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{margin-bottom:16px}
.hero .eyebrow{font-family:var(--serif);font-size:13px;color:var(--accent);letter-spacing:.03em}
.hero .big{font-family:var(--serif);font-size:33px;line-height:1.15;margin-top:3px;letter-spacing:-.01em}
.hero .big small{font-size:15px;color:var(--ink2);font-family:var(--sans);margin-left:3px}
.hero .sub{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.6}

.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:transparent;padding:8px 2px;border-radius:8px;font-size:13px;color:var(--ink2);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(22,50,63,.08)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border:none;padding:0}
.lbl{font-size:11.5px;color:var(--ink3);margin-bottom:5px;letter-spacing:.01em}
.sec{font-size:13.5px;color:var(--ink2);margin:22px 0 9px;font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.7}
.faint{color:var(--ink3);font-size:11.5px;line-height:1.65}
.num{font-family:var(--serif)}

.btn{border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line);font-weight:500}
.btn.tiny{padding:6px 11px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14.5px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;line-height:1.7;font-size:13.5px}
.amt{text-align:right;font-feature-settings:"tnum"}
.field{margin-bottom:11px}
.grid2{display:flex;gap:10px}
.grid2>*{flex:1;min-width:0}

.acc{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:none;border-top:1px solid var(--line2);padding:12px 0;font-size:14px}
.acc .tag{color:var(--ink2);display:flex;align-items:center;gap:6px}
.acc .chev{color:var(--ink3);font-size:12px}
.accbody{padding:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.95}
.accbody .rowline{margin-bottom:2px}

.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}

.entry{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.entry .cat{font-size:11px;color:var(--ink3);flex:0 0 62px}
.entry .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .val{font-size:14px}
.entry .del{background:none;border:none;color:var(--line);font-size:16px;padding:0 2px}
.entry .del:hover{color:var(--down)}
.chip{font-size:10.5px;padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:middle}
.chip.p{background:#FDF2DC;color:#8A6112}
.chip.r{background:#E3F3EA;color:#1E6B47}
.chip.s{background:#FBF1DC;color:#7A6020}

.daterow{font-size:12px;color:var(--ink2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-top:16px}

.legend{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px}
.legend i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--ink2)}
.piewrap{display:flex;gap:16px;align-items:center}

.note{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
.note.warn{background:#FDF4E3;color:#8A6112;border:1px solid #F0DFBC}
.note.info{background:var(--accent-soft);color:#0B6B6E;border:1px solid #C9E6E5}
.note.err{background:#FBECEA;color:#96382E;border:1px solid #F2D2CD}

.prose{font-size:13.5px;line-height:1.9;white-space:pre-wrap}
.pend{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.pend select{flex:0 0 96px;padding:6px 5px;font-size:12px;border-radius:7px}
.pend .it{flex:1;min-width:0;padding:7px 8px;font-size:13px;border-radius:7px}
.pend .am{flex:0 0 82px;padding:7px 8px;font-size:13px;border-radius:7px}
.toggle{flex:0 0 auto;font-size:11px;padding:6px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink3)}
.toggle[aria-pressed="true"]{border-color:var(--amber);color:#8A6112;background:#FDF2DC}

.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:18px 0}

/* 2026 UI refresh — Toss-inspired, readable and calm */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --surface2:#EEF3F8;
  --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1;
  --line:#E5E8EB; --line2:var(--ghost);
  --accent:#3182F6; --accent-soft:#EAF3FF;
  --up:#00A76F; --down:#F04452; --amber:#F59F00;
  --radius:20px;
  --card:#FFFFFF; --field:#F7F9FA; --ghost:#F2F4F6; --track:#E9EEF4; --tabbar:rgba(255,255,255,.92);
}
body{background:var(--bg)}
#app{max-width:520px;padding:20px 16px 72px}
.hero{margin-bottom:14px}
.hero-card{position:relative;overflow:hidden;min-height:148px;padding:23px 22px;border-radius:26px;background:linear-gradient(135deg,#1769E0 0%,#3182F6 58%,#72A9FF 100%);color:#fff;box-shadow:0 16px 36px rgba(49,130,246,.22)}
.hero-card:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-74px;top:-85px;background:rgba(255,255,255,.13)}
.hero-copy{position:relative;z-index:1;max-width:72%}
.hero .eyebrow{font-family:var(--sans);font-size:12px;font-weight:700;color:rgba(255,255,255,.78);letter-spacing:.02em}
.hero .big{font-family:var(--sans);font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.035em;margin-top:7px}
.hero .big small{font-size:15px;color:rgba(255,255,255,.86);font-family:var(--sans);font-weight:600}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:8px;line-height:1.5}
.mascot{position:absolute;right:17px;bottom:12px;width:105px;height:105px;filter:drop-shadow(0 9px 10px rgba(19,72,151,.2));animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px) rotate(1deg)}}
.tabs{position:relative;gap:3px;background:var(--tabbar);backdrop-filter:blur(12px);padding:5px;border-radius:16px;margin:14px 0 20px;box-shadow:0 4px 18px rgba(25,31,40,.06)}
.main-tabs{position:sticky;top:8px;z-index:10}
.tabs button{padding:9px 2px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:800;box-shadow:0 2px 8px rgba(49,130,246,.12)}
.card{border:0;border-radius:var(--radius);padding:18px;margin-bottom:13px;box-shadow:0 5px 20px rgba(25,31,40,.055)}
.lbl{font-size:12px;color:var(--ink3);font-weight:600}
.sec{font-size:17px;color:var(--ink);margin:27px 2px 12px;font-weight:800;letter-spacing:-.02em}
.num{font-family:var(--sans);font-weight:750;letter-spacing:-.025em}
.btn{border-radius:13px;padding:12px 17px;font-weight:750;box-shadow:0 4px 12px rgba(49,130,246,.16)}
.btn.ghost{background:var(--ghost);border:0;color:var(--ink2);box-shadow:none;font-weight:650}
.btn.tiny{border-radius:10px}
input[type=text],input[type=number],input[type=password],textarea,select{background:var(--field);border:1px solid transparent;border-radius:13px;padding:11px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus,select:focus{background:var(--card);border-color:#9CC4FA;box-shadow:0 0 0 3px rgba(49,130,246,.1)}
.note{border:0;border-radius:14px}
.note.info{background:var(--accent-soft);color:#1B64C8}
.bar{height:8px;background:var(--track)}
.bar>i{background:linear-gradient(90deg,#3182F6,#6FA8FF)}
.entry{align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:0}
.entry .cat{flex:0 0 auto;min-width:54px;width:auto;padding:5px 8px;border-radius:9px;background:var(--ghost);color:var(--ink2);font-size:10.5px;font-weight:700;text-align:center}
.entry .nm{font-size:14px;font-weight:600}
.entry .val{font-size:14px;font-weight:750;white-space:nowrap}
.entry.income .cat{background:#E8F8F2;color:#008A5A}
.entry.expense .cat{background:#FFF0F1;color:#D83B49}
.daterow{font-weight:700;color:var(--ink2);padding:16px 2px 7px;border-bottom:0;margin-top:0}
.record-intro{display:flex;align-items:center;gap:13px;margin-bottom:12px;padding:4px 3px}
.mini-mascot{flex:0 0 54px;width:54px;height:54px}
.record-intro strong{display:block;font-size:17px;letter-spacing:-.02em;margin-bottom:3px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}
.summary-card{background:var(--card);border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(25,31,40,.05)}
.summary-card .amount{margin-top:5px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.flow-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:var(--track);border-radius:15px;margin:19px 0 8px}
.flow-switch button{border:0;background:transparent;padding:11px;border-radius:11px;color:var(--ink2);font-size:14px;font-weight:700}
.flow-switch button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 2px 8px rgba(25,31,40,.08)}
.weekgroup,.estate-fold{background:var(--card);border:0;border-radius:18px;margin:10px 0;box-shadow:0 4px 16px rgba(25,31,40,.045);overflow:hidden}
.weekgroup>summary,.estate-fold>summary{list-style:none;cursor:pointer;padding:16px 17px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:10px}
.weekgroup>summary::-webkit-details-marker,.estate-fold>summary::-webkit-details-marker{display:none}
.weekgroup>summary:after,.estate-fold>summary:after{content:"";flex:0 0 auto;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-2px) rotate(45deg);transition:transform .18s}
.weekgroup[open]>summary:after,.estate-fold[open]>summary:after{transform:translateY(2px) rotate(225deg)}
.weekbody{padding:0 16px 10px;border-top:1px solid var(--line2)}
.weekmeta{color:var(--ink3);font-size:11.5px;font-weight:600;margin-left:auto}
.empty-state{text-align:center;padding:28px 14px;color:var(--ink3);font-size:13px;line-height:1.7}
.estate-body{padding:0 17px 17px;border-top:1px solid var(--line2)}
.asset-kicker{display:flex;align-items:flex-end;justify-content:space-between;margin:3px 2px 13px}
.asset-kicker strong{font-size:20px;letter-spacing:-.03em}
.asset-kicker span{font-size:13px;color:var(--ink2)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.quick-btn{border:0;border-radius:17px;padding:15px 12px;background:var(--card);box-shadow:0 5px 18px rgba(25,31,40,.055);font-size:14px;font-weight:800;text-align:left}
.quick-btn b{display:block;font-size:21px;margin-bottom:5px}
.quick-btn.expense b{color:var(--down)}.quick-btn.income b{color:var(--up)}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.more-card{border:0;background:var(--card);border-radius:20px;padding:18px;text-align:left;min-height:120px;box-shadow:0 5px 20px rgba(25,31,40,.055)}
.more-card .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--accent-soft);font-size:20px;margin-bottom:18px}
.more-card strong{display:block;font-size:16px;margin-bottom:5px}.more-card span{font-size:12px;color:var(--ink3);line-height:1.5}
.subpage-head{display:flex;align-items:center;gap:10px;margin:0 2px 17px}
.subpage-head button{border:0;background:var(--card);width:34px;height:34px;border-radius:11px;font-size:18px;box-shadow:0 3px 10px rgba(25,31,40,.06)}
.subpage-head strong{font-size:20px;letter-spacing:-.03em}
.asset-view{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:13px}
.asset-view:first-of-type{border-top:0}.asset-view .meta{color:var(--ink3);font-size:11.5px;margin-top:3px}
.edit-pill{border:0;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:8px 12px;font-weight:750;font-size:12.5px}
.analysis-hero{background:linear-gradient(135deg,#152A4A,#244F86);color:#fff;border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 12px 25px rgba(21,42,74,.16)}
.analysis-hero .lbl{color:rgba(255,255,255,.68)}
.analysis-hero .amount{font-size:26px;font-weight:850;margin-top:5px;letter-spacing:-.035em}
.sync-strip{display:flex;align-items:center;justify-content:center;gap:7px;margin:-8px 0 17px;color:var(--ink3);font-size:11.5px;font-weight:650}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#AAB2BD;box-shadow:0 0 0 3px rgba(170,178,189,.13)}
.sync-dot.ok{background:var(--up);box-shadow:0 0 0 3px rgba(0,167,111,.12)}
.sync-dot.work{background:var(--amber);animation:pulse 1s ease-in-out infinite}.sync-dot.bad{background:var(--down)}
@keyframes pulse{50%{opacity:.35}}
.budget-card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 22px rgba(49,130,246,.08)}
.budget-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.budget-remaining{font-size:23px;font-weight:850;letter-spacing:-.035em}
.budget-row{margin-top:12px}.budget-row .rowline{font-size:12px;margin-bottom:5px}
.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.budget-input{background:var(--card);border-radius:14px;padding:10px}
.budget-input .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget-input input{margin-top:4px;text-align:right;padding:8px 9px}
.trend-card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(25,31,40,.05)}
.coin{animation:coinDrop 3.6s ease-in infinite}
@keyframes coinDrop{0%,55%{transform:translateY(0);opacity:1}78%{transform:translateY(20px);opacity:1}86%,100%{transform:translateY(22px);opacity:0}}
/* 홈이 아닌 탭에서는 순자산 카드를 한 줄 크기로 줄여 입력칸이 바로 보이게 한다 */
.hero-card.compact{min-height:0;padding:15px 20px;border-radius:20px;box-shadow:0 8px 20px rgba(49,130,246,.16)}
.hero-card.compact:before{width:110px;height:110px;right:-46px;top:-58px}
.hero-card.compact .big{font-size:23px;margin-top:3px}
.hero-card.compact .sub{display:none}
.hero-card.compact .mascot{width:58px;height:58px;right:14px;bottom:4px}
.pf-total{font-size:26px;font-weight:850;letter-spacing:-.035em;margin-top:4px}
.pf-total small{font-size:14px;color:var(--ink2);font-weight:600;margin-left:2px}
.pf-pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:5px;font-size:14px;font-weight:750}
.acct-bar{display:flex;gap:2px;height:10px;margin:16px 0 6px;border-radius:5px;overflow:hidden}
.acct-bar i{display:block;min-width:4px}
.acct-row{width:100%;display:flex;align-items:center;gap:8px;border:0;border-top:1px solid var(--line2);background:transparent;padding:10px 0;font-size:13.5px;text-align:left}
.acct-row:first-of-type{border-top:0}
.acct-row .pc{color:var(--ink3);font-size:12px}
.acct-row b{margin-left:auto;font-weight:750}
.acct-dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.acct-tabs button{display:flex;align-items:center;justify-content:center;gap:5px}
.acct-chip{font-size:11px;font-weight:750;padding:3px 8px;border-radius:7px;white-space:nowrap}
.stock-card{padding:13px 15px 13px 19px;margin-bottom:8px;box-shadow:inset 4px 0 0 var(--acct),0 5px 20px rgba(25,31,40,.055)}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.6}
.check-row:first-of-type{border-top:0;margin-top:6px}
.check-dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--ink3)}
.check-dot.ok{background:var(--up)}.check-dot.warn{background:var(--amber)}.check-dot.bad{background:var(--down)}.check-dot.info{background:var(--accent)}
/* 다크 모드: 색은 모두 변수라 값만 바꾼다 */
:root[data-theme="dark"]{--bg:#0F1318;--surface:#1A1F26;--surface2:#222831;--ink:#E9EDF2;--ink2:#AAB4BF;--ink3:#7A8591;--line:#2A313A;--line2:#232931;--accent:#4C94FF;--accent-soft:#1C2D47;--card:#1A1F26;--field:#222831;--ghost:#262D36;--track:#2A313A;--tabbar:rgba(22,27,33,.94);color-scheme:dark}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .budget-card,:root[data-theme="dark"] .trend-card,:root[data-theme="dark"] .quick-btn{box-shadow:none;border:1px solid var(--line)}
:root[data-theme="dark"] .note.info{color:#9CC2FF}
:root[data-theme="dark"] .note.warn{background:#3A2F17;color:#F5C76B;border-color:#4A3B1C}
:root[data-theme="dark"] .note.err{background:#3D1F1F;color:#F2A3A3;border-color:#4D2626}
:root[data-theme="dark"] .entry.income .cat{background:#123326;color:#5FD3A1}
:root[data-theme="dark"] .entry.expense .cat{background:#3A1C20;color:#F28B95}
:root[data-theme="dark"] .acct-chip{filter:brightness(.9) saturate(1.1)}
/* 하단 탭바: 엄지가 닿는 화면 아래 */
#app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:5px 0 calc(5px + env(safe-area-inset-bottom))}

function krAmount(text){
  const s=text.replace(/,/g,""); const re=/(\d+(?:\.\d+)?)\s*(억|만|천)?/g;
  let m,total=0,found=false,lastEnd=-1;
  while((m=re.exec(s))!==null){
    if(found&&m.index>lastEnd)break;
    const v=parseFloat(m[1]),u=m[2];
    total+=v*(u==="억"?1e8:u==="만"?1e4:u==="천"?1e3:1);
    found=true; lastEnd=m.index+m[0].length;
  }
  return found?Math.round(total):null;
}

}

async function authCall(path,body,token,method="POST"){
  const c=sbConf();
  if(!c.url||!c.key) throw new Error("Supabase 연결 정보가 없어요. 설정 → 계정의 '고급: Supabase 연결'에 한 번만 입력해 주세요.");
  const headers={apikey:c.key,"Content-Type":"application/json"};
  if(token) headers.Authorization=`Bearer ${token}`;
  let r;
  try{ r=await fetch(`${c.url}/auth/v1/${path}`,{method,headers,body:method==="GET"?undefined:JSON.stringify(body||{})}); }
  catch(e){ throw new Error("인터넷 연결을 확인해 주세요."); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    const m=d.msg||d.error_description||d.message||"";
    const e=new Error(
      r.status===429||/rate limit|security purposes/i.test(m)?"요청이 너무 잦아요. 잠시 뒤에 다시 시도해 주세요.":
      /invalid login credentials/i.test(m)?"이메일 또는 비밀번호가 맞지 않거나, 아직 가입하지 않은 이메일이에요.":
      /email not confirmed/i.test(m)?"가입 확인 메일의 링크를 먼저 눌러 주세요. 메일이 안 보이면 스팸함도 확인해 주세요.":
      /already registered|already exists/i.test(m)?"이미 가입된 이메일이에요. 로그인을 눌러 주세요.":
      /password/i.test(m)&&/least|short|weak/i.test(m)?"비밀번호는 6자 이상으로 정해 주세요.":
      /invalid api key|no api key/i.test(m)?"Supabase anon 키가 맞지 않아요. '고급: Supabase 연결'을 확인해 주세요.":
      (m||`로그인 요청 실패 (${r.status})`));
    e.status=r.status; throw e;
  }
  return d;
}
const appUrl=()=>location.origin+location.pathname;
async function signIn(email,pw){ return storeAuth(await authCall("token?grant_type=password",{email,password:pw})); }
async function signUp(email,pw){
  const d=await authCall(`signup?redirect_to=${encodeURIComponent(appUrl())}`,{email,password:pw});
  if(d.access_token) return {session:storeAuth(d)};
  // 이미 가입된 이메일이면 Supabase는 빈 identities를 돌려준다.
  if(Array.isArray(d.identities)&&!d.identities.length) throw new Error("이미 가입된 이메일이에요. 로그인을 눌러 주세요.");
  return {needsConfirm:true};
}
const requestReset=email=>authCall(`recover?redirect_to=${encodeURIComponent(appUrl())}`,{email});
let refreshing=null;
// 만료 1분 전이면 refresh 토큰으로 새로 받는다. 네트워크 오류로는 로그아웃시키지 않는다.
async function getAccessToken(){
  const a=readAuth(); if(!a?.refresh_token) return null;
  if(a.access_token&&a.expires_at-60>Date.now()/1000) return a.access_token;
  refreshing=refreshing||authCall("token?grant_type=refresh_token",{refresh_token:a.refresh_token}).then(storeAuth)
    .catch(e=>{ if(e.status===400||e.status===401) localStorage.removeItem(AUTH_KEY); return null; })
    .finally(()=>{ refreshing=null; });
  return (await refreshing)?.access_token||null;
}
async function signOut(){
  const t=await getAccessToken().catch(()=>null);
  if(t) authCall("logout",{},t).catch(()=>{});
  localStorage.removeItem(AUTH_KEY);
}
async function updatePassword(pw){
  const t=await getAccessToken();
  if(!t) throw new Error("로그인이 만료됐어요. 비밀번호 재설정 메일을 다시 받아 주세요.");
  await authCall("user",{password:pw},t,"PUT");
}
// 가입 확인·비밀번호 재설정 메일의 링크(#access_token=…)로 들어왔을 때 로그인 처리.
let recoveryMode=false;
async function consumeAuthLink(){
  const hash=location.hash.replace(/^#/,"");
  if(!/access_token=|error_description=/.test(hash)) return;
  history.replaceState(null,"",location.pathname+location.search);
  const p=new URLSearchParams(hash);
  if(p.get("error_description")){ notice="메일 링크가 만료됐거나 확인하지 못했어요. 다시 요청해 주세요."; return; }
  try{
    const tok=p.get("access_token"), user=await authCall("user",null,tok,"GET");
    storeAuth({access_token:tok,refresh_token:p.get("refresh_token"),expires_at:+p.get("expires_at")||0,expires_in:+p.get("expires_in")||3600,user});
    recoveryMode=p.get("type")==="recovery";
    notice=recoveryMode?"새 비밀번호를 정해 주세요.":"이메일 확인이 끝났어요. 로그인됐어요.";
    if(recoveryMode) tab="설정";
  }catch(e){ notice="메일 링크로 로그인하지 못했어요. 이메일·비밀번호로 로그인해 주세요."; }
}

/* ── 계정 데이터: wealth_user_state (RLS로 로그인한 본인 행만 읽고 쓸 수 있다) ── */
async function rest(method,path,body,extra={}){
  const c=sbConf(), jwt=await getAccessToken();
  if(!jwt) throw new Error("로그인이 만료됐어요. 다시 로그인해 주세요.");
  const r=await fetch(`${c.url}/rest/v1/${path}`,{method,headers:{apikey:c.key,Authorization:`Bearer ${jwt}`,"Content-Type":"application/json",...extra},body:body==null?undefined:JSON.stringify(body)});
  if(!r.ok){
    let m=""; try{ m=(await r.json()).message||""; }catch(e){}
    if(/does not exist|could not find the table/i.test(m)||r.status===404) throw new Error("wealth_user_state 테이블이 없어요. Supabase에서 설정 SQL을 먼저 실행해 주세요.");
    throw new Error(m||`동기화 요청 실패 (${r.status})`);
  }
  return r;
}
async function cloudRead(){ const rows=await (await rest("GET","wealth_user_state?select=data,updated_at&limit=1")).json(); return rows[0]||null; }
async function cloudWrite(data,at){
  await rest("POST","wealth_user_state?on_conflict=user_id",[{user_id:readAuth().user.id,data,updated_at:at}],{Prefer:"resolution=merge-duplicates,return=minimal"});
}

// 충돌 상태에서는 자동 업로드를 멈춰, 사용자가 고르기 전에 어느 쪽도 덮어쓰지 않는다.
function sbReady(){ return signedIn()&&!window.__conflict; }
async function commit(){
  touchNetWorthSnapshot();
  await saveLocal(S);
  if(sbReady()) syncState={status:"syncing",error:""};
  render();
  if(sbReady()){
    try{ await sbSave(); }
    catch(e){ syncState={status:"error",error:e.message||"동기화 실패"}; }
    render();
  }
}
async function sbSave(){
  if(!sbReady()) return;
  syncState={status:"syncing",error:""};
  const syncedAt=new Date().toISOString();
  const settings={...S.settings}; LOCAL_ONLY.forEach(k=>delete settings[k]);
  const payload={...S,settings,meta:{...(S.meta||{}),lastSync:syncedAt}};
  try{ await cloudWrite(payload,syncedAt); }
  catch(e){ syncState={status:"error",error:e.message||"동기화 실패"}; throw e; }
  // 업로드 도중 새로 저장된 변경이 있을 수 있으니 meta를 통째로 바꾸지 않고 lastSync만 올린다.
  S.meta={...(S.meta||{}),lastSync:syncedAt};
  syncState={status:"synced",error:""};
  await saveLocal(S,false);
}
// 서버 데이터를 받아들이되, 이 기기에만 두는 키·연결 정보는 그대로 유지한다.
function adoptServer(row){
  const keep={}; LOCAL_ONLY.forEach(k=>keep[k]=S.settings[k]);
  S=merge(DEFAULT,row.data);
  S.settings={...S.settings,...keep};
  S.meta={...(S.meta||{}),lastSync:row.updated_at||new Date().toISOString()};
}
async function sbPull(opts={}){
  if(!signedIn()){ if(opts.manual){ notice="먼저 로그인해 주세요."; render(); } return; }
  if(opts.manual&&isDirty()&&!confirm("이 기기에 아직 계정으로 올라가지 못한 변경이 있어요.\n계정 데이터로 덮어쓰면 그 변경은 사라집니다. 계속할까요?")) return;
  busy.sync=true; syncState={status:"syncing",error:""}; render();
  try{
    const data=await cloudRead();
    if(data&&data.data){
      window.__needImport=false;
      const serverChanged=ts(data.updated_at)>ts(S.meta?.lastSync);
      if(!opts.manual&&!opts.force&&isDirty()){
        // 앱을 열었는데 이 기기에 못 올린 변경이 있는 경우: 서버가 그대로면 올리고, 서버도 바뀌었으면 사용자에게 묻는다.
        if(!serverChanged){ await sbSave(); notice="지난번에 올리지 못한 변경을 계정에 올렸습니다."; }
        else { window.__conflict=true; syncState={status:"conflict",error:""}; }
      }else{
        window.__conflict=false;
        if(serverChanged) keepBackup("계정에서 불러오기 전");
        adoptServer(data); touchNetWorthSnapshot(); await saveLocal(S,false);
        syncState={status:"synced",error:""};
        if(opts.manual||opts.force) notice="계정에서 데이터를 불러왔습니다.";
      }
    }else if(S.tx.length||S.stocks.length){
      await sbSave(); notice="이 기기의 기록을 계정에 올렸어요. 이제 다른 기기에서도 로그인하면 보여요.";
    }else{
      // 계정도 비어 있고 이 기기에도 기록이 없으면, 예전 동기화 코드에서 옮겨오도록 안내한다.
      window.__needImport=true; syncState={status:"synced",error:""};
    }
  }catch(e){ syncState={status:"error",error:e.message||"동기화 실패"}; notice="동기화 중 문제가 생겼습니다: "+(e.message||""); }
  busy.sync=false; render();
}
async function sbPush(){
  if(!signedIn()){ notice="먼저 로그인해 주세요."; return render(); }
  window.__conflict=false;
  try{ await sbSave(); notice="계정에 올렸습니다."; }
  catch(e){ notice="업로드에 실패했습니다: "+(e.message||""); }
  render();
}
// 덮어쓰기 직전에 이 기기 데이터를 최대 5개까지 보관한다 (기록 복구용, 이 기기에만).
const BACKUP_KEY="wealth:backups";
function readBackups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]"); }catch(e){ return []; } }
function keepBackup(reason){
  if(!(S.tx.length||S.stocks.length)) return;
  const list=readBackups(); list.unshift({at:new Date().toISOString(),reason,data:JSON.parse(JSON.stringify(S))});
  try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(list.slice(0,5))); }
  catch(e){ try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(list.slice(0,2))); }catch(_){} }
}
async function readLegacy(code){
  const c=sbConf();
  const r=await fetch(`${c.url}/rest/v1/wealth_data?id=eq.${encodeURIComponent(code)}&select=data,updated_at`,{headers:{apikey:c.key,Authorization:`Bearer ${c.key}`}});
  if(!r.ok) throw new Error(`예전 데이터를 읽지 못했어요 (${r.status})`);
  const rows=await r.json();
  return rows.length&&rows[0].data?rows[0]:null;
}
// 복구할 수 있는 기록을 모두 모아 요약한다.
async function findRecoverable(code){
  const list=[{src:"device",label:"지금 이 기기",data:S,at:S.meta?.lastLocalSave}];
  if(signedIn()){ const r=await cloudRead(); if(r&&r.data) list.push({src:"cloud",label:"계정에 저장된 기록",data:r.data,at:r.updated_at}); }
  if(code){
    const r=await readLegacy(code);
    if(r){ list.push({src:"legacy",label:"예전 동기화 코드",data:r.data,at:r.updated_at}); S.settings.syncCode=code; await saveLocal(S,false); }
  }
  readBackups().forEach(b=>list.push({src:"backup",label:`자동 백업 · ${b.reason}`,data:b.data,at:b.at}));
  return list.map(x=>{ const tx=x.data.tx||[]; return {...x,count:tx.length,last:tx.map(t=>t.date).sort().pop()||null,stocks:(x.data.stocks||[]).length}; });
}
async function restoreFrom(item){
  keepBackup("복구 전");
  adoptServer({data:JSON.parse(JSON.stringify(item.data)),updated_at:item.at});
  touchNetWorthSnapshot();
  window.__conflict=false; window.__needImport=false; window.__recov=null;
  await saveLocal(S);
  if(signedIn()) await sbSave();
}

/* ══════════════ AI 호출 ══════════════ */
const DEFAULT_CHAIN="gemini-flash-latest,gemini-2.5-flash,gemini-2.5-flash-lite";
function modelChain(){ return (S.settings.modelChain||DEFAULT_CHAIN).split(",").map(s=>s.trim()).filter(Boolean); }
function activeModelIndex(){
  if(S.settings.modelDate!==today()){ S.settings.modelDate=today(); S.settings.modelIndex=0; }
  return S.settings.modelIndex||0;
}
async function callGemini(model,prompt,web){
  const k=(S.settings.apiKey||"").trim();
  const body={ contents:[{role:"user",parts:[{text:prompt}]}],
               generationConfig:{ temperature:0.7, maxOutputTokens:2048 } };
  if(web) body.tools=[{google_search:{}}];
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(k);
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){
    let msg="";
    try{ const j=await res.json(); msg=(j.error&&j.error.message)||""; }catch(_){}
    const e=new Error("api "+res.status);
    e.status=res.status; e.detail=msg;
    throw e;
  }
  const j=await res.json();
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.map(p=>p.text||"").filter(Boolean).join("\n").trim();
  if(!text) throw new Error("empty response");
  return text;
}
async function ai(prompt,web){
  const k=(S.settings.apiKey||"").trim();
  if(!k){ const e=new Error("nokey"); e.nokey=true; throw e; }
  const chain=modelChain();
  let idx=activeModelIndex();
  let lastErr=null;
  for(; idx<chain.length; idx++){
    try{
      const text=await callGemini(chain[idx],prompt,web);
      if(idx!==(S.settings.modelIndex||0)){ S.settings.modelIndex=idx; S.settings.modelDate=today(); await saveLocal(S,false); }
      return text;
    }catch(e){
      lastErr=e;
      if(e&&e.status===429&&idx<chain.length-1){ continue; } // 이 모델 한도 초과 → 다음 모델로
      throw e;
    }
  }
  throw lastErr||new Error("모든 모델의 한도를 초과했습니다.");
}
function aiErr(e,what){
  if(e&&e.nokey) return "설정 탭에서 Google AI Studio API 키를 먼저 입력해 주세요.";
  if(e&&e.status===429) return "오늘 등록된 모델을 모두 써서 한도에 걸렸습니다. 내일 다시 시도하거나 설정에서 모델 목록을 늘려주세요.";
  if(e&&e.status===404) return "모델 이름을 찾을 수 없습니다. 설정에서 모델 목록을 확인해 주세요.";
  if(e&&(e.status===401||(e.status===400&&/API key/i.test(e.detail||"")))) return "API 키가 올바르지 않습니다. 설정에서 다시 확인해 주세요.";
  return what+"에 실패했습니다. 잠시 후 다시 시도해 주세요."+(e&&e.detail?` (${e.detail.slice(0,80)})`:"");
}
const stripJson=t=>t.replace(/```json|```/g,"").trim();

/* ══════════════ 파생 계산 ══════════════ */
function calc(){
  const ls=loanStatus(today());
  const bankDebt=ls.balance;
  const fl=S.familyLoan;
  const after=S.tx.filter(t=>t.date>=fl.asOf);

  const cardAdd=after.filter(t=>t.parentCard).reduce((a,b)=>a+b.amount,0);
  const familyDebt=Math.max(0,fl.openingBalance-repaid+cardAdd);

}
function touchNetWorthSnapshot(){
  const c=calc(), m=ym(today());
  S.netWorthHistory=Array.isArray(S.netWorthHistory)?S.netWorthHistory:[];
  const snap={ym:m,date:today(),net:Math.round(c.net),assets:Math.round(c.totalAssets),debt:Math.round(c.totalDebt)};
  const i=S.netWorthHistory.findIndex(x=>x.ym===m);
  const before=i>=0?JSON.stringify(S.netWorthHistory[i]):"";
  if(i>=0) S.netWorthHistory[i]=snap; else S.netWorthHistory.push(snap);

}

const fmtYM=m=>{ m=Math.ceil(m); const y=Math.floor(m/12), r=m%12; return y?`${y}년${r?` ${r}개월`:""}`:`${r}개월`; };
// 월 평균 순자산 증가 속도. 순자산 기록이 3개월 이상 쌓이면 그 추세를, 아니면 최근 3개월 가계부의 (수입 − 지출)을 쓴다.
function monthlyPace(){
  const nh=(S.netWorthHistory||[]).slice(-7);
  if(nh.length>=3){
    const [y0,m0]=nh[0].ym.split("-").map(Number), [y1,m1]=nh[nh.length-1].ym.split("-").map(Number);

  const cur=monthAgg(m), prev=monthAgg(pm);

  const pinc=prev.base+prev.side, prate=pinc?(pinc-prev.expense)/pinc*100:null;

  if(inc||cur.expense) rows.push([save>=0?"ok":"bad",`이번 달 남은 돈 <b style="color:${save>=0?"var(--up)":"var(--down)"}">${save>=0?"+":"−"}${won(Math.abs(save))}원</b>${rate!=null?` · 저축률 ${Math.round(rate)}%`:""}${rate!=null&&prate!=null?` <span class="faint">(지난달 ${Math.round(prate)}%)</span>`:""}`]);

  }
  const repaid=S.tx.filter(t=>t.famRepay&&ym(t.date)===m).reduce((s,t)=>s+t.amount,0);

  if(fp) rows.push([fp.thisMonth>=fp.need?"ok":"info",`부모님 상환 이번 달 ${won(fp.thisMonth)}원 / 목표 ${won(fp.need)}원 <span class="faint">(${fp.monthsLeft}개월 남음)</span>`]);
  else if(repaid) rows.push(["info",`이번 달 부모님 상환 ${won(repaid)}원 · 남은 차입금 ${uk(c.familyDebt)}`]);
  if(pace) rows.push(["info",`순자산이 한 달에 약 ${won(Math.abs(pace.v))}원씩 ${pace.v>=0?"늘고":"줄고"} 있어요 <span class="faint">(${pace.basis} 기준)</span>`]);
  if(+m.slice(5,7)>=10){
    const tp=taxPlan(), left=Math.max(0,tp.pensionLimit-contribYearSum("연금저축"));

}
// 큰 금액을 "4억 2,632만원"처럼 한국식 단위로 보여준다.
function korWon(n){
  if(n==null||isNaN(n)) return "-";
  const s=n<0?"−":""; n=Math.abs(Math.round(n));
  const e=Math.floor(n/1e8), m=Math.floor(n%1e8/1e4);
  if(!e&&!m) return s+won(n)+"원";
  return s+(e?`${e}억`:"")+(e&&m?" ":"")+(m?`${m.toLocaleString("ko-KR")}만`:"")+"원";
}

// 매달 반복 항목을 아직 안 들어간 달만큼 기록한다. id를 "rec-규칙-연월"로 고정해 두 기기에서 돌아도 중복되지 않는다.
function applyRecurring(){
  let added=0; const now=today(), curYm=ym(now), dNow=+now.slice(8,10);
  (S.recurring||[]).forEach(r=>{
    if(!r.lastPosted){ r.lastPosted=curYm; return; }
    let [y,m]=r.lastPosted.split("-").map(Number);
    for(let guard=0;guard<24;guard++){
      m++; if(m>12){m=1;y++;}
      const ymS=`${y}-${pad(m)}`; if(ymS>curYm) break;
      const day=Math.min(r.day,new Date(y,m,0).getDate());
      if(ymS===curYm&&day>dNow) break;
      const id=`rec-${r.id}-${ymS}`;
      if(!S.tx.some(t=>t.id===id)){
        S.tx.push({id,date:`${ymS}-${pad(day)}`,type:r.type,amount:r.amount,cat:r.type==="income"?"수입":r.cat,item:r.item,
          parentCard:false,famRepay:!!r.famRepay,sideIncome:!!r.sideIncome,recurring:true});
        added++;
      }
      r.lastPosted=ymS;
    }
  });
  return added;
}
// 부모님 차입금을 목표 시점까지 다 갚으려면 매달 얼마가 필요한지.
function famPlan(c){
  const fl=S.familyLoan, t=fl.targetYm;
  if(!t||!/^\d{4}-\d{2}$/.test(t)) return null;
  const [ty,tm]=t.split("-").map(Number), [cy,cm]=ym(today()).split("-").map(Number);
  const monthsLeft=Math.max(1,(ty-cy)*12+(tm-cm)+1);
  const thisMonth=S.tx.filter(x=>x.famRepay&&ym(x.date)===ym(today())).reduce((s,x)=>s+x.amount,0);
  const base=fl.openingBalance+c.cardAdd;
  return {monthsLeft,need:Math.ceil((c.familyDebt+thisMonth)/monthsLeft),thisMonth,pct:base?c.repaid/base*100:0};
}

function budgetInfo(){

function pie(rows,total,size,big,empty){
  if(!total) return `<div class="faint" style="padding:12px 0">${empty}</div>`;
  let a=-90; const r=size/2-1,cx=size/2,cy=size/2;
  const xy=t=>[cx+r*Math.cos(t*Math.PI/180),cy+r*Math.sin(t*Math.PI/180)];
  let paths="",leg="";
  rows.forEach(row=>{
    const f=row.sum/total,st=a,en=a+f*360; a=en;
    const lg=en-st>180?1:0,[x1,y1]=xy(st),[x2,y2]=xy(en);
    const col=CAT_COLOR[row.cat]||"#A8BAC2";
    paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`;
    leg+=`<div class="legend" style="font-size:${big?12.5:11.5}px"><i style="background:${col}"></i><span class="nm">${esc(row.cat)}</span><span class="pc">${Math.round(f*100)}%</span></div>`;
  });
  return `<div class="piewrap">
    <div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="var(--surface)"/></svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <span class="num" style="font-size:${big?14:11.5}px">${won(total)}</span></div>
    </div><div style="flex:1;min-width:0">${leg}</div></div>`;
}

/* ── 월별 지출 막대 + 추세선 ── */
// zoom=true면 0원이 아니라 값의 범위에 맞춰 세로축을 잡는다 (순자산처럼 큰 값의 작은 변화용).
function trendChart(months,vals,color,label,zoom){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;
  const max=Math.max(...vals,1), min=Math.min(...vals);
  const span=max-min||Math.abs(max)*0.02||1;
  const lo=zoom?min-span*0.35:0, hi=zoom?max+span*0.2:max;
  const x=i=>pad+(W-pad*2)/months.length*(i+0.5);
  const y=v=>H-8-((v-lo)/(hi-lo))*(H-34);
  let bars="",line="",area="",dots="",labels="";
  months.forEach((m,i)=>{
    if(!zoom){
      const bh=(vals[i]/max)*(H-34);
      bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-8-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${color}" opacity="0.22"/>`;
    }
    line+=`${i?"L":"M"}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`;
    dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="${zoom?3.5:2.6}" fill="${color}" stroke="#fff" stroke-width="${zoom?2:0}"><title>${mLabel(m)} ${won(vals[i])}원</title></circle>`;
    labels+=`<text x="${x(i).toFixed(1)}" y="${H+4}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${mLabel(m)}</text>`;
  });
  if(zoom&&months.length>1) area=`<path d="${line}L${x(months.length-1).toFixed(1)},${H-8}L${x(0).toFixed(1)},${H-8}Z" fill="${color}" opacity="0.1"/>`;
  return `<svg viewBox="0 0 ${W} ${H+10}" width="100%" style="display:block;overflow:visible">
    ${bars}${area}<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}
  </svg>
  <div class="faint" style="text-align:right;margin-top:2px">${label} · ${zoom&&months.length>1?`${uk(min)} ~ ${uk(max)}`:`최고 ${won(max)}원`}</div>`;
}

/* ── 월별 수입 누적 막대 (본봉 / 부수입) ── */
function stackedIncome(months,base,side){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;
  const totals=months.map((_,i)=>base[i]+side[i]);
  const max=Math.max(...totals,1);
  const x=i=>pad+(W-pad*2)/months.length*(i+0.5);
  let bars="",labels="";
  months.forEach((m,i)=>{
    const hb=(base[i]/max)*(H-34), hs=(side[i]/max)*(H-34);
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-8-hb).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,hb).toFixed(1)}" fill="${CAT_COLOR["본봉"]}"/>`;
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-8-hb-hs).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,hs).toFixed(1)}" fill="${CAT_COLOR["부수입"]}"/>`;
    labels+=`<text x="${x(i).toFixed(1)}" y="${H+4}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${mLabel(m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+10}" width="100%" style="display:block;overflow:visible">${bars}${labels}</svg>
  <div style="display:flex;gap:14px;justify-content:flex-end;margin-top:4px">
    <span class="legend" style="margin:0"><i style="background:${CAT_COLOR["본봉"]}"></i><span style="font-size:11.5px">본봉</span></span>
    <span class="legend" style="margin:0"><i style="background:${CAT_COLOR["부수입"]}"></i><span style="font-size:11.5px">부수입</span></span>
  </div>`;
}

            <span>이전 ${r.oldPrice?won(r.oldPrice)+"원":"없음"}${r.proposed==null?' <span style="color:var(--down)">· 찾지 못함</span>':!r.confident?' <span style="color:var(--amber)">· AI 확신 낮음</span>':""}${r.basisDate?" · "+fmtDate(r.basisDate)+" 기준":""}</span>
            <span>${pct!=null?`<b style="color:${pct>=0?'var(--up)':'var(--down)'}">${pct>=0?"+":""}${pct.toFixed(1)}%</b>`:""}</span>

    {

    h+=`<details class="weekgroup" style="margin-top:12px"><summary><span>주가 갱신 문제 해결</span><span class="weekmeta">보조 기능</span></summary>
      <div class="weekbody"><div class="faint" style="padding:11px 0">자동 종가 갱신이 실패했을 때만 사용하세요. AI가 제안한 가격은 확인 후 선택적으로 반영됩니다.</div>

    if(assetEdit) h+=`<div class="card" style="padding:12px 14px;margin-top:12px">

    // 부동산 시세는 "자산 수정"을 누르지 않아도 바로 고칠 수 있게 항상 입력칸을 보여준다.
    h+=`<details class="estate-fold" open>
      <summary><span>부동산</span><span class="weekmeta">${won(c.re)}원</span></summary>

        <div class="field" style="margin-top:10px"><div class="lbl">현재 시세 (직접 입력)</div><input type="text" class="amt" id="reprice" inputmode="numeric" value="${won(c.re)}"></div>

        <div class="btnrow"><button class="btn ghost tiny" id="refreshprice" ${busy.price?"disabled":""}>${spin(busy.price,busy.price?"조회 중…":"AI로 실거래가 확인")}</button></div>

        <div class="rowline" style="margin-top:13px;padding-top:11px;border-top:1px solid var(--line2);font-size:13px">
          <span class="muted">자기자본 (시세 − 은행부채)</span><span>${won(c.re-c.bankDebt)}원</span></div>
      </div>
    </details>`;
    h+=swapCalc(c);
    h+=eventsCard(c);

    h+=`<div class="sec">기타 자산 <span class="muted" style="font-weight:400">${won(c.othersSum)}원</span></div>
    <div class="faint" style="margin-bottom:9px">현금, 예금, 교직원공제회, 주택청약 등을 한곳에서 봅니다.</div>`;
    S.others.forEach(o=>{
      h+=assetEdit?`<div class="card" style="padding:11px 13px;margin-bottom:8px"><div class="grid2" style="align-items:center">
          <input type="text" data-oname="${o.id}" value="${esc(o.name)}" style="border:none;background:transparent;padding:4px 0;font-size:14px">
          <input type="text" data-oamt="${o.id}" class="amt" inputmode="numeric" value="${won(o.amount)}" style="border:none;background:transparent;padding:4px 0;flex:0 0 110px">
          <button class="del" data-delother="${o.id}" style="flex:0 0 auto">×</button>
        </div></div>`:`<div class="card" style="padding:5px 15px;margin-bottom:8px"><div class="asset-view"><span>${esc(o.name)}</span><strong>${won(o.amount)}원</strong></div></div>`;
    });
    h+=`${assetEdit?`<div class="btnrow"><button class="btn ghost tiny" id="addother">항목 추가</button></div>`:""}

    `;
  }

  /* ───── 설정 ───── */
  if(tab==="설정"){
    h+=`<div class="subpage-head"><strong>설정</strong></div>
    <div class="sec" id="budgetSettings" style="margin-top:2px">한 달 생활비</div>
    <div class="card"><div class="field"><div class="lbl">한 달에 쓸 생활비</div><input type="text" class="amt" id="budgetTotal" inputmode="numeric" value="${S.budgets?.monthlyTotal?won(S.budgets.monthlyTotal):''}" placeholder="예: 2,000,000"></div>
      <div class="faint">고정비(매달 반복·고정비로 표시한 기록)와 부모님 상환은 빼고, 이번 기간 변동비만 이 금액과 비교해요.</div>
      <div class="field" style="margin-top:12px"><div class="lbl">월급날 (생활비 한 달의 시작)</div><select id="payday">${Array.from({length:28},(_,i)=>i+1).map(d=>`<option value="${d}"${(S.budgets?.payday||1)===d?" selected":""}>${d===1?"1일 (달력 기준)":d+"일"}</option>`).join("")}</select></div>
      <div class="faint">예: 17일로 두면 17일부터 다음 달 16일까지를 한 달로 봐요.</div></div>


    <div class="sec" id="accountSec">계정 (기기 간 동기화)</div>
    <div class="card">${accountCard()}</div>

    <div class="sec">화면 모드</div>
    <div class="flow-switch theme-switch" role="tablist" aria-label="화면 모드">
      ${[["auto","폰 설정 따라"],["light","라이트"],["dark","다크"]].map(([v,l])=>`<button role="tab" aria-selected="${(S.settings.theme||"auto")===v}" data-themeset="${v}">${l}</button>`).join("")}
    </div>

    <div class="sec">Google AI Studio API 키</div>
    <div class="card">
      <div class="field"><div class="lbl">API 키</div>
        <input type="password" data-set="apiKey" value="${esc(S.settings.apiKey)}" placeholder="AIza..."></div>
      <div class="field"><div class="lbl">모델 순서 (쉼표로 구분, 앞에서부터 시도)</div>
        <input type="text" data-set="modelChain" value="${esc(S.settings.modelChain||DEFAULT_CHAIN)}" placeholder="${DEFAULT_CHAIN}"></div>
      <div class="faint">첫 번째 모델의 무료 한도를 다 쓰면 자동으로 다음 모델로 넘어갑니다 (같은 날 안에서 기억해뒀다가 계속 다음 모델을 씁니다). 모델 이름이 바뀌면 이 칸만 고치면 됩니다.</div>
      <div class="faint" style="margin-top:8px">aistudio.google.com에서 무료로 발급받을 수 있습니다. 운동앱에서 쓰시는 키를 그대로 넣으셔도 됩니다. 키는 이 기기에만 저장되고, 기기 간 동기화로도 올라가지 않습니다. 다른 기기에서는 한 번 따로 입력해 주세요.</div>
      ${S.settings.modelIndex?`<div class="faint" style="margin-top:8px;color:var(--amber)">오늘은 ${(S.settings.modelChain||DEFAULT_CHAIN).split(",")[S.settings.modelIndex]||""} 모델을 쓰고 있어요 (앞 모델 한도 초과).</div>`:""}
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost tiny" id="testai" ${busy.aiTest?"disabled":""}>${spin(busy.aiTest,busy.aiTest?"확인 중…":"연결 테스트")}</button></div>
      ${window.__aiTestResult?`<div class="faint" style="margin-top:8px;white-space:pre-wrap">${esc(window.__aiTestResult)}</div>`:""}
    </div>

    <div class="sec">데이터</div>

      <button class="btn ghost" id="exp">내보내기</button>
      <button class="btn ghost" id="imp">가져오기</button>
    </div>

    <details style="margin-top:22px"><summary class="muted" style="cursor:pointer">고급 — 부모님 차입금 기준값</summary>
      <div class="card" style="margin-top:10px">
        <div class="field"><div class="lbl">기준 잔액</div><input type="text" class="amt" data-fam="openingBalance" inputmode="numeric" value="${won(S.familyLoan.openingBalance)}"></div>
        <div class="field"><div class="lbl">기준일 (이 날짜 이후 기록만 반영)</div><input type="text" data-fam="asOf" value="${esc(S.familyLoan.asOf)}"></div>
        <div class="faint">평소엔 건드릴 일이 없습니다. 실제 잔액과 어긋날 때만 맞춰주세요.</div>
      </div></details>

    <div class="faint" style="margin-top:22px">기록은 이 기기(및 연결한 Supabase)에만 저장됩니다. 계좌번호·카드번호는 적지 마세요.</div>`;

  h+=bottomNav();

/* ══════════════ 이벤트 바인딩 ══════════════ */
function bind(){
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  $$("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;notice="";render()});
  $$("[data-quick]").forEach(b=>b.onclick=()=>{txView=b.dataset.quick;tab="기록";render();setTimeout(()=>document.querySelector("#txin")?.focus(),0)});
  $$("[data-openbudget]").forEach(b=>b.onclick=()=>{tab="설정";render();setTimeout(()=>document.querySelector("#budgetSettings")?.scrollIntoView({behavior:"smooth"}),0)});
  $$("[data-txview]").forEach(b=>b.onclick=()=>{txView=b.dataset.txview;render()});
  $$("[data-acc]").forEach(b=>b.onclick=()=>{openDebt=openDebt===b.dataset.acc?null:b.dataset.acc;render()});

  const ta=$("#txin");
  if(ta){ ta.oninput=()=>window.__draft=ta.value; }


  if($("#doparse")) $("#doparse").onclick=doParse;
  if($("#cancelpend")) $("#cancelpend").onclick=()=>{pending=[];render()};
  if($("#savepend")) $("#savepend").onclick=async()=>{
    S.tx=[...S.tx,...pending]; pending=[]; window.__draft=""; notice=""; await commit();
  };
  $$("[data-pcat]").forEach(el=>el.onchange=()=>{const i=+el.dataset.pcat;const v=el.value;
    pending[i].cat=v; pending[i].type=v==="수입"?"income":"expense"; render()});
  $$("[data-pitem]").forEach(el=>el.oninput=()=>{pending[+el.dataset.pitem].item=el.value});
  $$("[data-pamt]").forEach(el=>el.oninput=()=>{pending[+el.dataset.pamt].amount=+el.value.replace(/[^\d]/g,"")||0});
  $$("[data-ptog]").forEach(el=>el.onclick=()=>{const i=+el.dataset.ptog;pending[i].parentCard=!pending[i].parentCard;render()});
  $$("[data-del]").forEach(el=>el.onclick=async(e)=>{e.stopPropagation();S.tx=S.tx.filter(t=>t.id!==el.dataset.del);await commit()});

  if($("#reprice")) $("#reprice").onchange=async e=>{S.realEstate.currentPrice=+e.target.value.replace(/[^\d]/g,"")||0;S.realEstate.basis=`직접 입력 (${today()})`;await commit()};
  if($("#rename")) $("#rename").onchange=async e=>{S.realEstate.name=e.target.value;await commit()};
  if($("#refreshprice")) $("#refreshprice").onclick=refreshPrice;
  if($("#toggleAssetEdit")) $("#toggleAssetEdit").onclick=()=>{assetEdit=!assetEdit;render()};
  if($("#budgetTotal")) $("#budgetTotal").onchange=async e=>{S.budgets=S.budgets||{monthlyTotal:0,categories:{}};S.budgets.monthlyTotal=+e.target.value.replace(/[^\d]/g,"")||0;await commit()};
  $$("[data-budget-cat]").forEach(el=>el.onchange=async()=>{S.budgets=S.budgets||{monthlyTotal:0,categories:{}};S.budgets.categories=S.budgets.categories||{};S.budgets.categories[el.dataset.budgetCat]=+el.value.replace(/[^\d]/g,"")||0;await commit()});

  $$("[data-stacct-tab]").forEach(el=>el.onclick=()=>{ stockAcctTab=el.dataset.stacctTab; render(); });
  if($("#addstock")) $("#addstock").onclick=async()=>{
    const n=$("#stname").value.trim();
    const code=normCode($("#stcode").value);
    const buy=+$("#stbuy").value.replace(/[^\d]/g,"")||0;
    const qty=+$("#stqty").value.replace(/[^\d]/g,"")||0;
    const acct=$("#stacct").value||"일반";
    if(!n||!buy||!qty)return;
    if(S.stocks.some(s=>s.name===n&&(s.account||"일반")===acct)){
      notice=`이미 ${acct}계좌에 "${n}" 종목이 있어요. 매수가·개수를 고치려면 기존 항목을 직접 수정해 주세요.`;
      return render();
    }
    S.stocks.push({id:uid(),name:n,code,account:acct,buyPrice:buy,qty,currentPrice:null,priceDate:null});
    await commit();
  };
  $$("[data-delstock]").forEach(el=>el.onclick=async()=>{S.stocks=S.stocks.filter(s=>s.id!==el.dataset.delstock);await commit()});
  $$("[data-scode]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.scode);s.code=normCode(el.value);await commit()});
  $$("[data-sbuy]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sbuy);s.buyPrice=+el.value.replace(/[^\d]/g,"")||0;await commit()});
  $$("[data-sqty]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sqty);s.qty=+el.value.replace(/[^\d]/g,"")||0;await commit()});
  $$("[data-scur]").forEach(el=>el.onchange=async()=>{
    const s=S.stocks.find(x=>x.id===el.dataset.scur), v=+el.value.replace(/[^\d]/g,"")||0;
    s.currentPrice=v||null; s.priceDate=v?today():null; s.err=null; await commit();
  });
  $$("[data-sacct]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sacct);s.account=el.value;await commit()});
  if($("#fetchprices")) $("#fetchprices").onclick=fetchPriceProposals;
  if($("#applyreview")) $("#applyreview").onclick=applyPriceReview;
  if($("#cancelreview")) $("#cancelreview").onclick=()=>{window.__priceReview=null; render();};
  $$("[data-rvinc]").forEach(el=>el.onchange=()=>{window.__priceReview[+el.dataset.rvinc].include=el.checked;});

async function doParse(){
  const text=(window.__draft||"").trim();
  if(!text)return;
  busy.parse=true; notice=""; render();
  try{
    const raw=await ai(`오늘은 ${today()}이다. 가계부 메모를 항목별로 분해해 JSON 배열만 출력해라(설명·마크다운 금지).
각 원소: {"type":"expense"|"income","amount":정수,"cat":카테고리,"item":"짧은 항목명","parentCard":true|false,"famRepay":true|false,"sideIncome":true|false}
지출 카테고리는 정확히 이 중 하나: ${EXP_CATS.join(", ")}. 수입이면 cat은 "수입".
"(부)" 표시가 있으면 parentCard=true (항목명에서 "(부)"는 제거).
"부모님 상환"처럼 부모님께 빌린 돈을 갚는 내용이면 famRepay=true, type은 expense, cat은 "기타".\n수입 중 본업 월급이 아닌 것(부수입, 강의료, 월세, 배당, 이자, 원고료 등)은 sideIncome=true. 월급·급여는 sideIncome=false.
메모: ${text}`,false);
    const arr=JSON.parse(stripJson(raw));
    const date=resolveDate(text);
    const items=arr.filter(x=>x&&x.amount>0).map(x=>({
      id:uid(),date,type:x.type==="income"?"income":"expense",amount:Math.round(x.amount),
      cat:x.type==="income"?"수입":(EXP_CATS.includes(x.cat)?x.cat:"기타"),
      item:String(x.item||"").slice(0,24),parentCard:!!x.parentCard,famRepay:!!x.famRepay,sideIncome:!!x.sideIncome
    }));
    if(!items.length) throw new Error("empty");
    pending=items;
  }catch(e){
    const fb=localParse(text);
    if(fb.length){ pending=fb; notice=(e&&e.nokey)?"API 키가 없어 간단 규칙으로 읽었습니다. 분류를 확인해 주세요.":"자동 분류를 쓸 수 없어 간단 규칙으로 읽었습니다. 확인해 주세요."; }
    else notice="금액을 찾지 못했습니다. 예: '점심 9천원'";
  }
  busy.parse=false; render();
}

async function refreshPrice(){
  busy.price=true; notice=""; render();
  try{
    const raw=await ai(`너는 한국 부동산 데이터에 밝은 전문가다. 웹 검색(네이버페이 부동산 실거래가 우선)으로 "${S.realEstate.name}"의 최근 6개월 실거래가를 조사해라. 평형이 명시되어 있으면 반드시 그 평형의 거래만 봐라.

절차:
1) 최근 6개월 실거래가들의 평균을 계산해라.
2) 그 기간 동안 가격이 상승 추세인지, 하락 추세인지, 보합인지 판단해라.
3) 상승 추세면 평균보다 다소 높게, 하락 추세면 평균보다 다소 낮게, 보합이면 평균과 비슷하게 최종 추정 시세를 정해라. (방향성을 반영한 추정치이지, 단순 평균이 아니다)

JSON만 출력해라(설명·마크다운 없이):
{"avgPrice":정수(6개월 평균, 원 단위),"trend":"상승"|"하락"|"보합","estimatedPrice":정수(추세를 반영한 최종 추정 시세, 원 단위),"basis":"6개월 거래 추이와 추세 판단 근거, 확인한 시점·평형 포함, 3~4문장. 불확실하면 명시"}`,true);
    const o=JSON.parse(stripJson(raw));
    if(o.estimatedPrice>0){
      S.realEstate.currentPrice=Math.round(o.estimatedPrice);
      const trendLabel=o.trend?`[${o.trend} 추세, 6개월 평균 ${won(o.avgPrice)}원] `:"";
      S.realEstate.basis=trendLabel+(o.basis||"");
      await commit();
    } else throw new Error("no price");
  }catch(e){ notice=(e&&(e.nokey||e.status))?aiErr(e,"시세 갱신"):"시세 갱신에 실패했습니다. 네이버페이 부동산에서 직접 확인해 금액을 입력해 주세요."; }
  busy.price=false; render();
}

/* 장 마감 판정: 한국시간(KST) 기준 평일 16:00 이후. */
function aiConfigured(){
  return !!(S.settings.apiKey||"").trim();
}

/* 시세 조회: AI 웹검색으로 후보값을 받아온 뒤, 바로 반영하지 않고
   "제안 → 확인 → 적용" 단계를 거친다. 종목마다 이전가와 나란히 보여줘서
   이상한 값(오독·오검색)은 사람이 바로 걸러낼 수 있게 한다. */
// 시세처럼 웹 검색이 꼭 필요한 요청.
const aiWithSearch=prompt=>ai(prompt,true);
async function fetchPriceProposals(){
  if(!S.stocks.length) return;
  // 자동 갱신(매일 오후 4시 반)으로 최근 종가가 들어와 있는 종목은 건너뛴다.
  const stale=s=>s.currentPrice==null||s.err==="조회실패"||!s.priceDate||(Date.now()-new Date(s.priceDate).getTime())/86400000>4;
  const groups={};
  S.stocks.filter(stale).forEach(s=>{const k=normCode(s.code)||s.name;(groups[k]=groups[k]||[]).push(s);});
  const needed=Object.values(groups);
  if(!needed.length){
    const latest=S.stocks.map(s=>s.priceDate).filter(Boolean).sort().pop();
    notice=`모든 종목이 최근 종가${latest?`(${fmtDate(latest)})`:""}로 자동 갱신돼 있어요. 따로 확인할 필요 없어요.`;
    return render();
  }
  if(!(S.settings.apiKey||"").trim()){ notice="시세 확인은 웹 검색이 되는 Gemini 키가 필요해요. 설정 → Google AI Studio API 키를 넣거나, 자산 수정에서 현재가를 직접 입력해 주세요."; return render(); }

  busy.stocks=true; notice=""; window.__priceReview=null; render();
  try{
    const raw=await aiWithSearch(`너는 국내외 증시 데이터에 정확한 전문가다. 웹 검색으로 아래 종목들의 "가장 최근 거래일(전날 또는 그 이전 마지막 거래일) 종가"를 조사해라.
- 반드시 실제로 검색해서 찾은 값만 답하고, 추측하지 마라. 못 찾으면 price를 null로 둬라.
- 확신이 없으면 confident를 false로 표시해라.
- 해외 종목은 최근 환율로 원화 환산한 값을 price에 넣어라.
종목 목록: ${needed.map((g,i)=>`${i+1}) ${g[0].name}${normCode(g[0].code)?" ("+normCode(g[0].code)+")":""}`).join(", ")}
JSON 배열만 출력해라(설명·마크다운 없이). idx는 위 번호와 같게 해라:
[{"idx":1,"price":정수(1주당 원)|null,"basisDate":"YYYY-MM-DD(종가 기준일)","confident":true|false}]`);
    const arr=JSON.parse(stripJson(raw));
    window.__priceReview = needed.map((g,i)=>{
      const hit=arr.find(o=>Number(o.idx)===i+1)||{};
      const proposed = hit.price>0 ? Math.round(hit.price) : null;
      return {
        ids:g.map(s=>s.id), name:g[0].name+(g.length>1?` (${g.length}개 계좌)`:""), oldPrice:g[0].currentPrice,
        proposed, basisDate: hit.basisDate||null, confident: hit.confident!==false,
        include: proposed!=null, edited: proposed
      };
    });
  }catch(e){ notice=aiErr(e,"시세 조회"); }
  busy.stocks=false; render();
}

function applyPriceReview(){
  const rows=window.__priceReview||[];
  let applied=0;
  rows.forEach(r=>{
    if(!r.include) return;
    const v=Number(r.edited);
    if(!(v>0)) return;
    (r.ids||[]).forEach(id=>{
      const st=S.stocks.find(s=>s.id===id);
      if(!st) return;
      st.currentPrice=Math.round(v);
      st.priceDate=r.basisDate||today();
      st.err=null;
      applied++;
    });
  });
  window.__priceReview=null;
  notice = applied ? `${applied}개 종목에 반영했습니다.` : "선택된 항목이 없어 반영하지 않았습니다.";
  commit();
}

/* ══════════════ 시작 ══════════════ */
/* 일회성 정리: 카페/술 분리, 계좌명 변경 (과거 기록은 보존) */
const ALCOHOL_HINTS=["술","맥주","소주","와인","막걸리","포차","호프","치맥","안주","위스키","이자카야","바(bar)","펍"];
function migrateOnce(){
  if(S.meta&&S.meta.migratedV6) return false;
  let changed=false;
  S.tx.forEach(t=>{
    if(t.cat==="카페/술"){
      t.cat = ALCOHOL_HINTS.some(w=>t.item.includes(w)) ? "술" : "카페/편의점";
      changed=true;
    }
  });
  S.stocks.forEach(s=>{ if(s.account==="연금"){ s.account="연금저축"; changed=true; } });
  S.meta = { ...(S.meta||{}), migratedV6:true };
  return true;
}

(async function(){
  const saved=await loadLocal();
  if(saved) S=merge(DEFAULT,saved);
  const changed=migrateOnce();
  const snapshotChanged=touchNetWorthSnapshot();
  if(changed||snapshotChanged) await saveLocal(S,false);
  render();
  await consumeAuthLink();
  if(signedIn()) await sbPull(); else render();
  const added=applyRecurring();
  if(added){ notice=`매달 반복 항목 ${added}건을 자동으로 기록했어요.`; await commit(); }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if((S.settings.theme||"auto")==="auto") render(); });
})();
</script>
