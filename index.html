<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6F8">
<title>자산 로드맵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface2:#EAF0F3;
  --ink:#16323F; --ink2:#4F6B78; --ink3:#8AA2AD;
  --line:#DDE6EA; --line2:#EEF3F5;
  --accent:#0E8F93; --accent-soft:#E2F2F1;
  --up:#1E8E5A; --down:#D2554A; --amber:#D99A2B;
  --radius:14px;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --serif:'Gowun Batang','Apple SD Gothic Neo',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:470px;margin:0 auto;padding:18px 16px 56px}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{margin-bottom:16px}
.hero .eyebrow{font-family:var(--serif);font-size:13px;color:var(--accent);letter-spacing:.03em}
.hero .big{font-family:var(--serif);font-size:33px;line-height:1.15;margin-top:3px;letter-spacing:-.01em}
.hero .big small{font-size:15px;color:var(--ink2);font-family:var(--sans);margin-left:3px}
.hero .sub{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.6}

.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:transparent;padding:8px 2px;border-radius:8px;font-size:13px;color:var(--ink2);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(22,50,63,.08)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border:none;padding:0}
.lbl{font-size:11.5px;color:var(--ink3);margin-bottom:5px;letter-spacing:.01em}
.sec{font-size:13.5px;color:var(--ink2);margin:22px 0 9px;font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.7}
.faint{color:var(--ink3);font-size:11.5px;line-height:1.65}
.num{font-family:var(--serif)}

.btn{border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line);font-weight:500}
.btn.tiny{padding:6px 11px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=password],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14.5px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;line-height:1.7;font-size:13.5px}
.amt{text-align:right;font-feature-settings:"tnum"}
.field{margin-bottom:11px}
.grid2{display:flex;gap:10px}
.grid2>*{flex:1;min-width:0}

.acc{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:none;border-top:1px solid var(--line2);padding:12px 0;font-size:14px}
.acc .tag{color:var(--ink2);display:flex;align-items:center;gap:6px}
.acc .chev{color:var(--ink3);font-size:12px}
.accbody{padding:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.95}
.accbody .rowline{margin-bottom:2px}

.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}

.entry{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.entry .cat{font-size:11px;color:var(--ink3);flex:0 0 62px}
.entry .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .val{font-size:14px}
.entry .del{background:none;border:none;color:var(--line);font-size:16px;padding:0 2px}
.entry .del:hover{color:var(--down)}
.chip{font-size:10.5px;padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:middle}
.chip.p{background:#FDF2DC;color:#8A6112}
.chip.r{background:#E3F3EA;color:#1E6B47}
.chip.s{background:#FBF1DC;color:#7A6020}

.daterow{font-size:12px;color:var(--ink2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-top:16px}

.legend{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px}
.legend i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--ink2)}
.piewrap{display:flex;gap:16px;align-items:center}

.note{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
.note.warn{background:#FDF4E3;color:#8A6112;border:1px solid #F0DFBC}
.note.info{background:var(--accent-soft);color:#0B6B6E;border:1px solid #C9E6E5}
.note.err{background:#FBECEA;color:#96382E;border:1px solid #F2D2CD}

.prose{font-size:13.5px;line-height:1.9;white-space:pre-wrap}
.pend{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.pend select{flex:0 0 96px;padding:6px 5px;font-size:12px;border-radius:7px}
.pend .it{flex:1;min-width:0;padding:7px 8px;font-size:13px;border-radius:7px}
.pend .am{flex:0 0 82px;padding:7px 8px;font-size:13px;border-radius:7px}
.toggle{flex:0 0 auto;font-size:11px;padding:6px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink3)}
.toggle[aria-pressed="true"]{border-color:var(--amber);color:#8A6112;background:#FDF2DC}

.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:18px 0}
</style>
</head>

function loanStatus(asOf){

  for(const r of LOAN_SCHEDULE){ if(r[0]<=asOf) last=r; else { next=r; break; } }
  return { balance:last?last[2]:LOAN_SCHEDULE[0][2], nextDate:next?next[0]:null, nextAmount:next?next[1]:null,
           paid:LOAN_SCHEDULE.filter(r=>r[0]<=asOf).length, total:LOAN_SCHEDULE.length };
}
function krAmount(text){
  const s=text.replace(/,/g,""); const re=/(\d+(?:\.\d+)?)\s*(억|만|천)?/g;
  let m,total=0,found=false,lastEnd=-1;
  while((m=re.exec(s))!==null){
    if(found&&m.index>lastEnd)break;
    const v=parseFloat(m[1]),u=m[2];
    total+=v*(u==="억"?1e8:u==="만"?1e4:u==="천"?1e3:1);
    found=true; lastEnd=m.index+m[0].length;
  }
  return found?Math.round(total):null;
}

  const out=[],date=resolveDate(line);
  line.split(/[,\n·/]+| 그리고 /).map(p=>p.trim()).filter(Boolean).forEach(part=>{
    const amount=krAmount(part); if(!amount)return;
    const famRepay=FAM_REPAY_HINTS.some(w=>part.includes(w));
    const parentCard=part.includes("(부)");
    const isInc=!famRepay&&INC_HINTS.some(w=>part.includes(w));
    const item=part.replace("(부)","").replace(/\d[\d.,]*\s*(억|만|천)?\s*원?/g,"")
      .replace(/(썼|쓴|샀|사고|결제|지출|입금|받았다|받음|했)\S*/g,"").trim()||(isInc?"수입":famRepay?"부모님 상환":"지출");

    out.push({id:uid(),date,type:isInc?"income":"expense",amount,
      cat:isInc?"수입":"기타",item,parentCard,famRepay,sideIncome:side});
  });
  return out;
}

/* ══════════════ AI 호출 ══════════════ */
const DEFAULT_CHAIN="gemini-3-flash-preview,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash-lite";
function modelChain(){ return (S.settings.modelChain||DEFAULT_CHAIN).split(",").map(s=>s.trim()).filter(Boolean); }
function activeModelIndex(){
  if(S.settings.modelDate!==today()){ S.settings.modelDate=today(); S.settings.modelIndex=0; }
  return S.settings.modelIndex||0;
}
async function callGemini(model,prompt,web){
  const k=(S.settings.apiKey||"").trim();
  const body={ contents:[{role:"user",parts:[{text:prompt}]}],
               generationConfig:{ temperature:0.7, maxOutputTokens:2048 } };
  if(web) body.tools=[{google_search:{}}];
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(k);
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){
    let msg="";
    try{ const j=await res.json(); msg=(j.error&&j.error.message)||""; }catch(_){}
    const e=new Error("api "+res.status);
    e.status=res.status; e.detail=msg;
    throw e;
  }
  const j=await res.json();
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.map(p=>p.text||"").filter(Boolean).join("\n").trim();
  if(!text) throw new Error("empty response");
  return text;
}
async function ai(prompt,web){
  const k=(S.settings.apiKey||"").trim();
  if(!k){ const e=new Error("nokey"); e.nokey=true; throw e; }
  const chain=modelChain();
  let idx=activeModelIndex();
  let lastErr=null;
  for(; idx<chain.length; idx++){
    try{
      const text=await callGemini(chain[idx],prompt,web);
      if(idx!==(S.settings.modelIndex||0)){ S.settings.modelIndex=idx; S.settings.modelDate=today(); await saveLocal(S); }
      return text;
    }catch(e){
      lastErr=e;
      if(e&&e.status===429&&idx<chain.length-1){ continue; } // 이 모델 한도 초과 → 다음 모델로
      throw e;
    }
  }
  throw lastErr||new Error("모든 모델의 한도를 초과했습니다.");
}
function aiErr(e,what){
  if(e&&e.nokey) return "설정 탭에서 Google AI Studio API 키를 먼저 입력해 주세요.";
  if(e&&e.status===429) return "오늘 등록된 모델을 모두 써서 한도에 걸렸습니다. 내일 다시 시도하거나 설정에서 모델 목록을 늘려주세요.";
  if(e&&e.status===404) return "모델 이름을 찾을 수 없습니다. 설정에서 모델 목록을 확인해 주세요.";
  if(e&&e.status===400&&/API key/i.test(e.detail||"")) return "API 키가 올바르지 않습니다. 설정에서 다시 확인해 주세요.";
  return what+"에 실패했습니다. 잠시 후 다시 시도해 주세요.";
}

function calc(){
  const ls=loanStatus(today());
  const bankDebt=ls.balance;
  const fl=S.familyLoan;
  const after=S.tx.filter(t=>t.date>=fl.asOf);
  const repaid=after.filter(t=>t.famRepay).reduce((a,b)=>a+b.amount,0);
  const cardAdd=after.filter(t=>t.parentCard).reduce((a,b)=>a+b.amount,0);
  const familyDebt=Math.max(0,fl.openingBalance-repaid+cardAdd);
  const stocksSum=S.stocks.reduce((a,b)=>a+(b.currentPrice!=null?b.currentPrice:b.buyPrice)*b.qty,0);
  const othersSum=S.others.reduce((a,b)=>a+b.amount,0);
  const re=S.realEstate.currentPrice||0;
  const totalAssets=re+stocksSum+othersSum;
  const totalDebt=bankDebt+familyDebt;
  return {ls,bankDebt,familyDebt,repaid,cardAdd,stocksSum,othersSum,re,totalAssets,totalDebt,net:totalAssets-totalDebt};
}

function pie(rows,total,size,big,empty){
  if(!total) return `<div class="faint" style="padding:12px 0">${empty}</div>`;
  let a=-90; const r=size/2-1,cx=size/2,cy=size/2;
  const xy=t=>[cx+r*Math.cos(t*Math.PI/180),cy+r*Math.sin(t*Math.PI/180)];
  let paths="",leg="";
  rows.forEach(row=>{
    const f=row.sum/total,st=a,en=a+f*360; a=en;
    const lg=en-st>180?1:0,[x1,y1]=xy(st),[x2,y2]=xy(en);
    const col=CAT_COLOR[row.cat]||"#A8BAC2";
    paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${col}"/>`;
    leg+=`<div class="legend" style="font-size:${big?12.5:11.5}px"><i style="background:${col}"></i><span class="nm">${esc(row.cat)}</span><span class="pc">${Math.round(f*100)}%</span></div>`;
  });
  return `<div class="piewrap">
    <div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="var(--surface)"/></svg>

        <span class="num" style="font-size:${big?14:11.5}px">${won(total)}</span></div>
    </div><div style="flex:1;min-width:0">${leg}</div></div>`;
}

/* ── 월별 지출 막대 + 추세선 ── */
function trendChart(months,vals,color,label){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;
  const max=Math.max(...vals,1);
  const x=i=>pad+(W-pad*2)/months.length*(i+0.5);
  const y=v=>H-8-(v/max)*(H-34);
  let bars="",line="",dots="",labels="";
  months.forEach((m,i)=>{
    const bh=(vals[i]/max)*(H-34);
    bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-8-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${color}" opacity="0.22"/>`;
    line+=`${i?"L":"M"}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`;
    dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="2.6" fill="${color}"/>`;
    labels+=`<text x="${x(i).toFixed(1)}" y="${H+4}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${mLabel(m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+10}" width="100%" style="display:block;overflow:visible">
    ${bars}<path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>${dots}${labels}
  </svg>
  <div class="faint" style="text-align:right;margin-top:2px">${label} · 최고 ${won(max)}원</div>`;
}

function stackedIncome(months,base,side){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;

    <div class="faint" style="margin-top:22px">기록은 이 기기(및 연결한 Supabase)에만 저장됩니다. 계좌번호·카드번호는 적지 마세요.</div>`;
  }

  document.getElementById("app").innerHTML=h;
  bind();
}

  if($("#rename")) $("#rename").onchange=async e=>{S.realEstate.name=e.target.value;await commit()};

  $$("[data-scode]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.scode);s.code=normCode(el.value);await commit()});
  $$("[data-sbuy]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sbuy);s.buyPrice=+el.value.replace(/[^\d]/g,"")||0;await commit()});
  $$("[data-sqty]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sqty);s.qty=+el.value.replace(/[^\d]/g,"")||0;await commit()});
  $$("[data-sacct]").forEach(el=>el.onchange=async()=>{const s=S.stocks.find(x=>x.id===el.dataset.sacct);s.account=el.value;await commit()});
  if($("#refreshstocks")) $("#refreshstocks").onclick=()=>refreshStockPrices(true);

  if($("#addother")) $("#addother").onclick=async()=>{S.others.push({id:uid(),name:"새 항목",amount:0});await commit()};
  $$("[data-oname]").forEach(el=>el.onchange=async()=>{const o=S.others.find(x=>x.id===el.dataset.oname);o.name=el.value;await commit()});
  $$("[data-oamt]").forEach(el=>el.onchange=async()=>{const o=S.others.find(x=>x.id===el.dataset.oamt);o.amount=+el.value.replace(/[^\d]/g,"")||0;await commit()});
  $$("[data-delother]").forEach(el=>el.onclick=async()=>{S.others=S.others.filter(o=>o.id!==el.dataset.delother);await commit()});

  $$("[data-tname]").forEach(el=>el.onchange=async()=>{S.targets.find(t=>t.id===el.dataset.tname).name=el.value;await commit()});

      if(k==="supabaseUrl"||k==="supabaseKey"){ sb=null; await sbInit(); }

    };

    el.onchange=()=>{ clearTimeout(el.__t); flush(true); };
    el.onblur=()=>{ clearTimeout(el.__t); flush(false); };
  });
  $$("[data-fam]").forEach(el=>el.onchange=async()=>{
    const k=el.dataset.fam;

  });
  if($("#sbpull")) $("#sbpull").onclick=sbPull;
  if($("#sbpush")) $("#sbpush").onclick=sbPush;
  if($("#exp")) $("#exp").onclick=()=>{

async function doParse(){
  const text=(window.__draft||"").trim();
  if(!text)return;
  busy.parse=true; notice=""; render();
  try{
    const raw=await ai(`오늘은 ${today()}이다. 가계부 메모를 항목별로 분해해 JSON 배열만 출력해라(설명·마크다운 금지).
각 원소: {"type":"expense"|"income","amount":정수,"cat":카테고리,"item":"짧은 항목명","parentCard":true|false,"famRepay":true|false,"sideIncome":true|false}
지출 카테고리는 정확히 이 중 하나: ${EXP_CATS.join(", ")}. 수입이면 cat은 "수입".
"(부)" 표시가 있으면 parentCard=true (항목명에서 "(부)"는 제거).
"부모님 상환"처럼 부모님께 빌린 돈을 갚는 내용이면 famRepay=true, type은 expense, cat은 "기타".\n수입 중 본업 월급이 아닌 것(부수입, 강의료, 월세, 배당, 이자, 원고료 등)은 sideIncome=true. 월급·급여는 sideIncome=false.
메모: ${text}`,false);
    const arr=JSON.parse(stripJson(raw));
    const date=resolveDate(text);
    const items=arr.filter(x=>x&&x.amount>0).map(x=>({
      id:uid(),date,type:x.type==="income"?"income":"expense",amount:Math.round(x.amount),
      cat:x.type==="income"?"수입":(EXP_CATS.includes(x.cat)?x.cat:"기타"),
      item:String(x.item||"").slice(0,24),parentCard:!!x.parentCard,famRepay:!!x.famRepay,sideIncome:!!x.sideIncome
    }));
    if(!items.length) throw new Error("empty");
    pending=items;
  }catch(e){
    const fb=localParse(text);
    if(fb.length){ pending=fb; notice=(e&&e.nokey)?"API 키가 없어 간단 규칙으로 읽었습니다. 분류를 확인해 주세요.":"자동 분류를 쓸 수 없어 간단 규칙으로 읽었습니다. 확인해 주세요."; }
    else notice="금액을 찾지 못했습니다. 예: '점심 9천원'";
  }
  busy.parse=false; render();
}

/* 장 마감 판정: 한국시간(KST) 기준 평일 15:40 이후. 기기 시간대와 무관하게 동작. */
function kstNow(){
  const d=new Date();
  return new Date(d.getTime()+(d.getTimezoneOffset()*60000)+(9*3600000));
}
function isMarketClosed(){
  const d=kstNow(), day=d.getDay();
  if(day===0||day===6) return false;
  return d.getHours()>15 || (d.getHours()===15&&d.getMinutes()>=40);
}

  ];
}
function pickPrice(j){
  if(!j) return null;
  let raw=null;
  if(j.now!=null) raw=j.now;
  else if(j.closePrice!=null) raw=j.closePrice;
  else if(j.datas&&j.datas[0]) raw=(j.datas[0].closePrice!=null?j.datas[0].closePrice:j.datas[0].nv);
  else if(j.result&&j.result.areas&&j.result.areas[0]&&j.result.areas[0].datas&&j.result.areas[0].datas[0])
    raw=j.result.areas[0].datas[0].nv;
  if(raw==null) return null;
  const p=Number(String(raw).replace(/[^\d.]/g,""));
  return p>0?p:null;
}
async function fetchOnce(url,ms){
  const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  const t=ctl?setTimeout(()=>ctl.abort(),ms||9000):null;
  try{
    const r=await fetch(url,ctl?{cache:"no-store",signal:ctl.signal}:{cache:"no-store"});
    if(t)clearTimeout(t);
    if(!r.ok) return null;
    const txt=await r.text();
    try{ return JSON.parse(txt); }catch(e){ return null; }
  }catch(e){ if(t)clearTimeout(t); return null; }
}
async function fetchNaverPrice(code){
  for(const w of proxyWrappers()){
    for(const u of naverUrls(code)){
      const p=pickPrice(await fetchOnce(w(u)));
      if(p) return p;
    }
  }
  return null;
}

async function refreshStockPrices(manual){
  if(!S.stocks.length) return;
  busy.stocks=true; if(manual) notice=""; render();
  const pending=[];
  S.stocks.forEach(x=>{ x.err=null; });

  for(const st of S.stocks){
    const code=normCode(st.code);
    if(code.length!==6){ st.err="코드없음"; pending.push(st); continue; }
    const p=await fetchNaverPrice(code);
    if(p){ st.currentPrice=Math.round(p); st.priceDate=today(); st.err=null; }
    else { st.err="조회실패"; pending.push(st); }
  }

  if(pending.length && (S.settings.apiKey||"").trim()){
    try{
      const raw=await ai(`너는 한국 증시 데이터에 밝은 전문가다. 웹 검색으로 아래 종목들의 가장 최근 거래일 종가를 1주 기준 원화로 조사해라.
종목: ${pending.map((x,i)=>`${i+1}) ${x.name}${normCode(x.code)?" ("+normCode(x.code)+")":""}`).join(", ")}
JSON 배열만 출력해라(설명·마크다운 없이). idx는 위 번호와 같게 해라:
[{"idx":1,"price":정수(1주당 원)}]`,true);
      const arr=JSON.parse(stripJson(raw));
      pending.forEach((x,i)=>{
        const hit=arr.find(o=>Number(o.idx)===i+1)||arr[i];
        if(hit&&hit.price>0){ x.currentPrice=Math.round(hit.price); x.priceDate=today(); x.err=null; }
      });
    }catch(e){ if(manual) notice=aiErr(e,"시세 보완 조회"); }
  }

  const miss=S.stocks.filter(x=>x.priceDate!==today());
  const done=S.stocks.length-miss.length;
  await saveLocal(S); if(sbReady()) sbSave().catch(()=>{});
  if(manual){
    if(!miss.length) notice=`${done}개 종목 시세를 모두 갱신했습니다.`;
    else if(done) notice=`${done}개 갱신 완료. 실패: ${miss.map(x=>x.name).join(", ")}`;
    else if(!notice) notice="시세를 가져오지 못했습니다. 잠시 후 다시 시도하거나 종목코드를 확인해 주세요.";
  }
  busy.stocks=false; render();
}

async function recommend(){
  busy.rec=true; notice=""; render();
  const c=calc();
  const p=`너는 한국 부동산과 재무설계에 밝은 전문가다. 웹 검색(네이버페이 부동산 실거래가 우선)으로 최근 시세를 확인하고, 아래 고객에게 맞는 갈아타기 목표 아파트를 단계별로 추천해라.
${ctx()}
현재 보유: ${S.realEstate.name}, 시세 ${won(c.re)}원

1단계(5년 내): 마곡 / DMC(상암) / 한강뷰 단지 중 신혼·어린 자녀 기준 삶의 질이 좋은 실제 단지 2~3곳.
2단계(10년 내): 목동 학군지 중심으로 자녀 교육 여건이 좋은 실제 단지 2~3곳.

JSON만 출력해라(설명·마크다운 없이):
{"stage1":[{"name":"단지명 (평형)","price":정수,"why":"이 고객에게 맞는 이유 1~2문장"}],
 "stage2":[{"name":"단지명 (평형)","price":정수,"why":"이유 1~2문장"}],
 "comment":"현재 재무상태로 각 단계가 현실적인지, 관건이 무엇인지 4~5문장"}`;
  try{
    const o=JSON.parse(stripJson(await ai(p,true)));
    window.__rec={...o,date:today()};
  }catch(e){ notice=aiErr(e,"아파트 추천 생성"); }
  busy.rec=false; render();
}

/* ══════════════ 시작 ══════════════ */
(async function(){
  const saved=await loadLocal();
  if(saved) S=merge(DEFAULT,saved);
  render();
  if(S.settings.supabaseUrl&&S.settings.supabaseKey&&S.settings.syncCode){ await sbPull(); }
  if(isMarketClosed()&&S.stocks.some(s=>s.priceDate!==today())){
    refreshStockPrices(false).catch(()=>{});
  }
})();
